<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Owner Dashboard — Smart Lock Face Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/owner/assets/styles.css" rel="stylesheet"/>
</head>
<body class="bg-slate-50" onload="dashboardInit()">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-100 p-4">
      <div class="mb-6">
        <div class="font-semibold text-slate-900">Smart Lock Face Pro</div>
        <div class="text-xs text-slate-500">Owner Console</div>
      </div>
      <nav class="space-y-1">
        <a data-nav="dashboard" href="/owner/dashboard.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Dashboard</a>
        <a data-nav="locks" href="/owner/locks.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Locks</a>
        <a data-nav="users" href="/owner/users.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Users</a>
        <a data-nav="enroll" href="/owner/enroll.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Enroll</a>
        <a data-nav="logs" href="/owner/logs.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Logs</a>
        <a data-nav="settings" href="/owner/settings.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Settings</a>
      </nav>
      <button onclick="logout()" class="mt-6 w-full px-3 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700">Logout</button>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-6">
      <div class="flex items-center justify-between mb-6">
        <div>
          <div class="text-xl font-semibold text-slate-900">Dashboard</div>
          <div class="text-sm text-slate-500">Welcome, <span data-me="full_name"></span> (<span data-me="email"></span>)</div>
        </div>
        <span class="text-xs px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 font-medium">Realtime ready</span>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <section class="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
          <div class="flex items-center justify-between mb-3">
            <div class="font-semibold text-slate-900">Realtime Event Panel</div>
            <div class="text-xs text-slate-500">WebSocket /ws</div>
          </div>

          <div class="flex gap-2 mb-3">
            <select id="lockSel" class="flex-1 px-3 py-2 rounded-xl border border-slate-200">
            </select>
            <button onclick="joinWs()" class="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700">Join</button>
          </div>

          <div id="realtimePanel" class="max-h-80 overflow-auto"></div>
        </section>

        <section class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
          <div class="font-semibold text-slate-900 mb-2">System Info</div>
          <pre id="sysInfo" class="text-xs text-slate-700 whitespace-pre-wrap"></pre>
        </section>
      </div>
    </main>
  </div>

  <div id="toastArea" class="fixed bottom-4 right-4 w-80"></div>

  <script src="/owner/assets/common.js"></script>
  <script src="/owner/assets/auth.js"></script>
  <script src="/owner/assets/ws.js"></script>
  <script>
    async function dashboardInit(){
      guardAuth();
      setActiveNav("dashboard");
      await loadMe();

      const info = await apiFetch("/api/system/info");
      document.getElementById("sysInfo").textContent = JSON.stringify(info, null, 2);

      const locks = await apiFetch("/api/locks");
      const sel = document.getElementById("lockSel");
      sel.innerHTML = locks.map(l=> `<option value="${l.id}">${l.name} (#${l.id})</option>`).join("");
    }
    function joinWs(){
      const lockId = parseInt(document.getElementById("lockSel").value, 10);
      wsConnect(lockId);
      toast("Joined WS room lock #" + lockId, "success");
    }
  </script>
</body>
</html>
