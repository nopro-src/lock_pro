<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Owner Login — Smart Lock Face Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/owner/assets/styles.css" rel="stylesheet" />
</head>

<body class="min-h-screen bg-slate-100">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md owner-shell-card p-6">
      <div class="mb-6">
        <div class="flex items-center gap-3 mb-4">
          <div
            class="owner-brand-badge w-12 h-12 rounded-2xl flex items-center justify-center text-white font-bold shadow-lg">
            SL</div>
          <div>
            <div class="text-xl font-semibold text-slate-900">Smart Lock Face Pro</div>
            <div class="text-sm text-slate-500">Owner Console</div>
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-sm text-slate-600">Email</label>
          <input id="email" class="owner-input mt-1" placeholder="owner@example.com" />
        </div>
        <div>
          <label class="text-sm text-slate-600">Password</label>
          <input id="password" type="password" class="owner-input mt-1" placeholder="********" />
        </div>

        <button onclick="ownerLogin()" class="owner-btn-primary w-full">
          Sign in
        </button>

        <div class="text-xs text-slate-500">
          Dev seed: owner@example.com / Owner123456
        </div>
      </div>
    </div>
  </div>

  <div id="toastArea" class="fixed bottom-5 right-5 w-80 space-y-3 z-50"></div>
  <script src="/owner/assets/common.js"></script>
  <script src="/owner/assets/auth.js"></script>
</body>

</html>
