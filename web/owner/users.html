<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Users — Owner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/owner/assets/styles.css" rel="stylesheet"/>
</head>
<body class="bg-slate-50" onload="usersInit()">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white border-r border-slate-100 p-4">
      <div class="mb-6">
        <div class="font-semibold text-slate-900">Smart Lock Face Pro</div>
        <div class="text-xs text-slate-500">Owner Console</div>
      </div>
      <nav class="space-y-1">
        <a data-nav="dashboard" href="/owner/dashboard.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Dashboard</a>
        <a data-nav="locks" href="/owner/locks.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Locks</a>
        <a data-nav="users" href="/owner/users.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Users</a>
        <a data-nav="enroll" href="/owner/enroll.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Enroll</a>
        <a data-nav="logs" href="/owner/logs.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Logs</a>
        <a data-nav="settings" href="/owner/settings.html" class="block px-3 py-2 rounded-xl text-slate-700 hover:bg-slate-50">Settings</a>
      </nav>
      <button onclick="logout()" class="mt-6 w-full px-3 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700">Logout</button>
    </aside>

    <main class="flex-1 p-6">
      <div class="flex items-center justify-between mb-6">
        <div>
          <div class="text-xl font-semibold text-slate-900">Users</div>
          <div class="text-sm text-slate-500">Global user management</div>
        </div>
        <button onclick="openUserModal()" class="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700">+ New User</button>
      </div>

      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-slate-500">
            <tr class="border-b">
              <th class="text-left py-3">ID</th>
              <th class="text-left py-3">Full Name</th>
              <th class="text-left py-3">Email</th>
              <th class="text-left py-3">Role</th>
              <th class="text-left py-3">Status</th>
            </tr>
          </thead>
          <tbody id="usersTbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="userModal" class="hidden fixed inset-0 bg-black/30 flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-slate-100 p-5">
      <div class="flex items-center justify-between mb-4">
        <div class="text-lg font-semibold text-slate-900">Create User</div>
        <button onclick="closeUserModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div class="grid grid-cols-1 gap-3">
        <div>
          <label class="text-sm text-slate-600">Email</label>
          <input id="uEmail" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200"/>
        </div>
        <div>
          <label class="text-sm text-slate-600">Password</label>
          <input id="uPass" type="password" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200"/>
          <div class="text-xs text-slate-400 mt-1">Min 8 characters</div>
        </div>
        <div>
          <label class="text-sm text-slate-600">Full name</label>
          <input id="uName" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200"/>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-sm text-slate-600">Global role</label>
            <select id="uRole" class="mt-1 w-full px-3 py-2 rounded-xl border border-slate-200">
              <option value="USER">USER</option>
              <option value="OWNER">OWNER</option>
            </select>
          </div>
          <label class="flex items-center gap-2 mt-7 text-sm text-slate-700">
            <input id="uActive" type="checkbox" class="h-4 w-4" checked/>
            Active
          </label>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeUserModal()" class="px-4 py-2 rounded-xl border border-slate-200 hover:bg-slate-50">Cancel</button>
        <button onclick="createUser()" class="px-4 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700">Create</button>
      </div>
    </div>
  </div>

  <div id="toastArea" class="fixed bottom-4 right-4 w-80"></div>
  <script src="/owner/assets/common.js"></script>
  <script src="/owner/assets/auth.js"></script>
  <script src="/owner/assets/users.js"></script>
</body>
</html>
