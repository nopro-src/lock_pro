<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Locks — Owner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/owner/assets/styles.css" rel="stylesheet" />
</head>

<body class="bg-slate-100" onload="locksInit()">
  <div class="flex min-h-screen">
    <aside class="w-64 owner-sidebar text-slate-200 border-r border-slate-800 shadow-xl flex flex-col">
      <div class="px-6 py-6 border-b border-slate-800">
        <div class="flex items-center gap-3">
          <div
            class="owner-brand-badge w-11 h-11 rounded-2xl flex items-center justify-center text-white font-bold shadow-lg">
            SL</div>
          <div>
            <div class="font-semibold text-white text-lg tracking-tight">Smart Lock Face Pro</div>
            <div class="text-xs text-slate-400">Owner Console</div>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <a data-nav="dashboard" href="/owner/dashboard.html" class="owner-nav-item"><span
            class="owner-nav-dot bg-blue-400"></span>Dashboard</a>
        <a data-nav="locks" href="/owner/locks.html" class="owner-nav-item"><span
            class="owner-nav-dot bg-cyan-400"></span>Locks</a>
        <a data-nav="users" href="/owner/users.html" class="owner-nav-item"><span
            class="owner-nav-dot bg-emerald-400"></span>Users</a>
        <a data-nav="enroll" href="/owner/enroll.html" class="owner-nav-item"><span
            class="owner-nav-dot bg-violet-400"></span>Enroll</a>
        <a data-nav="logs" href="/owner/logs.html" class="owner-nav-item"><span
            class="owner-nav-dot bg-amber-400"></span>Logs</a>
        <a data-nav="settings" href="/owner/settings.html" class="owner-nav-item"><span
            class="owner-nav-dot bg-rose-400"></span>Settings</a>
      </nav>
      <div class="p-4 border-t border-slate-800">
        <button onclick="logout()"
          class="w-full px-4 py-3 rounded-2xl bg-white/5 border border-white/10 text-slate-200 hover:bg-white/10 hover:text-white transition-all">Logout</button>
      </div>
    </aside>

    <main class="flex-1 p-6 lg:p-8">
      <div class="mb-6 flex items-center justify-between">
        <div>
          <div class="text-3xl font-bold tracking-tight text-slate-900">Locks</div>
          <div class="mt-2 text-sm text-slate-500">Create, edit and manage smart locks</div>
        </div>
        <button onclick="openNewLock()" class="owner-btn-primary">+ New Lock</button>
      </div>

      <div class="owner-shell-card p-4 overflow-x-auto">
        <table class="owner-table w-full text-sm">
          <thead>
            <tr class="border-b border-slate-200">
              <th class="text-left py-3">ID</th>
              <th class="text-left py-3">Name</th>
              <th class="text-left py-3">Code</th>
              <th class="text-left py-3">Threshold</th>
              <th class="text-right py-3">Actions</th>
            </tr>
          </thead>
          <tbody id="locksTbody"></tbody>
        </table>
        <div class="text-xs text-slate-400 mt-3">
          Note: PUT/DELETE require backend endpoints. If missing, you’ll see 404 until implemented.
        </div>
      </div>
    </main>
  </div>

  <div id="lockModal" class="hidden fixed inset-0 owner-modal-backdrop flex items-center justify-center p-4">
    <div class="w-full max-w-lg owner-shell-card p-5">
      <div class="flex items-center justify-between mb-4">
        <div id="lockModalTitle" class="text-lg font-semibold text-slate-900">Create Lock</div>
        <button onclick="closeLockModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <input id="lockId" type="hidden" />

      <div class="grid grid-cols-1 gap-3">
        <div>
          <label class="text-sm text-slate-600">Name</label>
          <input id="lockName" class="owner-input mt-1" />
        </div>
        <div>
          <label class="text-sm text-slate-600">Pairing code</label>
          <input id="lockCode" class="owner-input mt-1" />
        </div>
        <div>
          <label class="text-sm text-slate-600">Threshold override (optional)</label>
          <input id="lockThreshold" class="owner-input mt-1" placeholder="0.70" />
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-5">
        <button onclick="closeLockModal()" class="owner-btn-secondary">Cancel</button>
        <button onclick="saveLock()" class="owner-btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toastArea" class="fixed bottom-5 right-5 w-80 space-y-3 z-50"></div>
  <script src="/owner/assets/common.js"></script>
  <script src="/owner/assets/auth.js"></script>
  <script src="/owner/assets/locks.js"></script>
</body>

</html>
