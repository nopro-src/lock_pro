<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Locks — Smart Lock Face Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/admin/assets/styles.css" rel="stylesheet"/>
</head>
<body onload="locksInit()">
<div class="d-flex">
  <aside class="sidebar p-3" style="width:280px">
    <div class="mb-3">
      <div class="fw-semibold">Smart Lock Face Pro</div>
      <div class="small-muted">Admin Console</div>
    </div>
    <nav class="nav flex-column gap-1">
      <a class="nav-link" data-page="dashboard" href="/admin/dashboard.html">Dashboard</a>
      <a class="nav-link" data-page="locks" href="/admin/locks.html">Locks</a>
      <a class="nav-link" data-page="users" href="/admin/users.html">Users</a>
      <a class="nav-link" data-page="enroll" href="/admin/enroll.html">Enroll</a>
      <a class="nav-link" data-page="logs" href="/admin/logs.html">Logs</a>
      <a class="nav-link" data-page="settings" href="/admin/settings.html">Settings</a>
    </nav>
    <hr class="sep my-3"/>
    <button class="btn btn-outline-light btn-sm w-100" onclick="logout()">Logout</button>
  </aside>

  <main class="flex-grow-1">
    <div class="topbar px-4 py-3 d-flex justify-content-between align-items-center">
      <div>
        <div class="fw-semibold">Locks</div>
        <div class="small-muted">Manage smart locks</div>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#lockModal">+ New Lock</button>
    </div>

    <div class="container-fluid p-4">
      <div class="card card-dark p-3">
        <div class="table-responsive">
          <table class="table table-darkish table-striped align-middle">
            <thead>
              <tr><th>ID</th><th>Name</th><th>Code</th><th>Threshold</th></tr>
            </thead>
            <tbody id="locksTbody"></tbody>
          </table>
        </div>
        <div class="small-muted">Pagination: (demo) load all. Production: add server pagination.</div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal fade" id="lockModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content card-dark">
      <div class="modal-header border-0">
        <h5 class="modal-title">Create Lock</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input id="lockName" class="form-control input-dark" placeholder="Main Door"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Pairing Code</label>
          <input id="lockCode" class="form-control input-dark" placeholder="LOCK-001"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Threshold Override (optional)</label>
          <input id="lockThr" class="form-control input-dark" placeholder="0.70"/>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="createLock()">Create</button>
      </div>
    </div>
  </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index:1080">
  <div id="toastArea" class="toast-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/admin/assets/common.js"></script>
<script src="/admin/assets/auth.js"></script>
<script src="/admin/assets/locks.js"></script>
</body>
</html>
