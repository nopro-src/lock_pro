<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Smart Lock Face Pro — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/admin/assets/styles.css" rel="stylesheet"/>
</head>
<body class="d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card card-dark p-4">
          <h3 class="mb-1">Smart Lock Face Pro</h3>
          <div class="small-muted mb-4">Admin Console</div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" class="form-control input-dark" placeholder="owner@local"/>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control input-dark" placeholder="••••••••"/>
          </div>

          <button class="btn btn-primary w-100" onclick="doLogin()">Login</button>
          <hr class="sep my-4"/>
          <div class="small-muted">
            Dev seed: <code>owner@local / Owner123456</code>
          </div>
        </div>

        <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1080">
          <div id="toastArea" class="toast-container"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/admin/assets/common.js"></script>
  <script src="/admin/assets/auth.js"></script>
</body>
</html>
